<h1>
    {% if email_sent %}
        Please check your email for a reset link!
    {% else %}
        Please click for a reset link sent to your email
    {% endif %}
</h1>
{% if not email_sent %}
<form method="post">
    {% csrf_token %}
    <input class="btn btn-primary max-btn" type="submit" value="Send Email" id="btn" onclick="changeState()">
</form>
{% endif %}
